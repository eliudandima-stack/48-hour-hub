<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>48 Hour Film Challenge Hub</title>
<meta name="description" content="Production hub for our Namibian horror short, made from script to final cut in 48 hours. Deadlines, crew, cast, locations and open questions.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="48 Hour Film Challenge">
<meta property="og:title" content="48 Hour Film Challenge · Production hub">
<meta property="og:description" content="Deadlines, crew, cast, locations and open questions for our 48-hour Namibian horror short. The clock starts Friday 4 December.">
<meta property="og:url" content="https://eliudandima-stack.github.io/48-hour-hub/">
<meta property="og:image" content="https://eliudandima-stack.github.io/48-hour-hub/og-image.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="48 Hour Film Challenge production hub: the YES and NO paper with two pencils, on an ink-blue slate">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0D1015">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* One visual world: a night house lit by one tungsten lamp. Ink-blue dark, amber light, cold steel for what's pending. */
  --bg: #0D1015;
  --panel: #151A21;
  --panel-2: #1C232D;
  --line: #2A323E;
  --text: #ECE6DA;
  --muted: #9BA3AD;
  --amber: #E3A247;
  --steel: #7E9BB8;
  --done: #7DB089;
  --urgent: #D9694E;
  --display: "Archivo Black", "Arial Black", Impact, sans-serif;
  --body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { animation: none !important; transition: none !important; } }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); font-size: 15px; line-height: 1.5; }
a { color: var(--amber); }
a:focus-visible, summary:focus-visible, button:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; border-radius: 6px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
.mono { font-family: var(--mono); }
.label { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* nav */
nav.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
nav.top .wrap { display: flex; gap: 8px; overflow-x: auto; padding-top: 10px; padding-bottom: 10px; scrollbar-width: none; }
nav.top a { flex: none; font-family: var(--mono); font-size: 12px; text-decoration: none; color: var(--muted); padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; }
nav.top a:hover { color: var(--text); border-color: var(--amber); }

/* hero */
header.hero { padding: 36px 0 28px; }
.slate { display: grid; grid-template-columns: 1fr auto; gap: 28px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 28px; position: relative; overflow: hidden; }
.slate::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 14px; background: repeating-linear-gradient(-45deg, var(--text) 0 14px, var(--bg) 14px 28px); opacity: .9; }
.slate h1 { font-family: var(--display); font-size: clamp(34px, 7vw, 64px); line-height: .95; letter-spacing: -.01em; margin-top: 14px; }
.slate h1 span { color: var(--amber); }
.slate .sub { color: var(--muted); margin: 12px 0 18px; max-width: 52ch; }
.slate-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.slate-grid div { padding: 10px 12px; border-right: 1px solid var(--line); }
.slate-grid div:last-child { border-right: 0; }
.slate-grid b { display: block; font-family: var(--mono); font-size: 15px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.countdown { text-align: center; min-width: 190px; }
.countdown .num { font-family: var(--display); font-size: 88px; line-height: 1; color: var(--amber); font-variant-numeric: tabular-nums; }
.countdown .unit { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.countdown .when { margin-top: 10px; font-size: 13px; color: var(--text); }
.countdown .tbc { display: inline-block; margin-top: 6px; font-family: var(--mono); font-size: 11px; color: var(--steel); border: 1px dashed var(--steel); border-radius: 999px; padding: 2px 10px; }
.paper { width: 170px; display: block; margin: 0 auto 6px; }

/* sections */
section { padding: 40px 0 8px; scroll-margin-top: 60px; }
.sec-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
.sec-head .no { font-family: var(--mono); color: var(--amber); font-size: 13px; }
.sec-head h2 { font-family: var(--display); font-size: clamp(24px, 4vw, 32px); letter-spacing: -.01em; }
.sec-head p { flex-basis: 100%; margin: 4px 0 0; color: var(--muted); max-width: 70ch; }

.pill { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.done { color: var(--done); } .pill.wip { color: var(--amber); } .pill.todo { color: var(--steel); } .pill.urgent { color: var(--urgent); }

/* progress tracker */
.track { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.stage { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.stage .icon { width: 34px; height: 34px; }
.stage h3 { font-size: 15px; font-weight: 700; }
.stage p { margin: 0; color: var(--muted); font-size: 13px; }
.stage.is-done { border-color: color-mix(in srgb, var(--done) 45%, var(--line)); }
.stage.is-wip { border-color: color-mix(in srgb, var(--amber) 55%, var(--line)); }

/* road timeline */
.road { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px 22px 18px; overflow-x: auto; }
.road-inner { position: relative; min-width: 1000px; height: 190px; }
.road-line { position: absolute; left: 0; right: 0; top: 92px; height: 2px; background: var(--line); }
.road-fill { position: absolute; left: 0; top: 92px; height: 2px; background: var(--amber); }
.ms { position: absolute; top: 0; width: 136px; transform: translateX(-50%); text-align: center; }
.ms .d { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.ms .t { font-size: 13px; font-weight: 600; margin-top: 2px; min-height: 38px; }
.ms .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--steel); background: var(--bg); margin: 18px auto 0; position: relative; }
.ms.big .dot { width: 22px; height: 22px; border-color: var(--amber); background: var(--amber); margin-top: 15px; }
.ms .who { font-size: 12px; color: var(--muted); margin-top: 14px; }
.ms.tbc .dot { border-style: dashed; }
.here { position: absolute; top: 152px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
.here span { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; color: var(--bg); background: var(--amber); padding: 2px 6px; border-radius: 4px; }
.here i { width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 7px solid var(--amber); }

/* deadlines */
.days { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.day { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
.day-top { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.day-top h3 { font-family: var(--display); font-size: 20px; }
.day-top .mono { color: var(--muted); font-size: 12px; }
.day.mon .day-top { background: color-mix(in srgb, var(--urgent) 14%, var(--panel)); }
.task { padding: 12px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
.task:last-child { border-bottom: 0; }
.task p { margin: 0; font-size: 14px; }
.who-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); }
.chip.all { background: color-mix(in srgb, var(--urgent) 22%, var(--panel-2)); border-color: color-mix(in srgb, var(--urgent) 50%, var(--line)); }
.later { margin-top: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.later ul { list-style: none; margin: 10px 0 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 18px; }
.later li { display: flex; gap: 10px; font-size: 14px; align-items: baseline; }
.later li b { flex: none; min-width: 92px; color: var(--amber); font-weight: 600; font-size: 13px; }

/* clock */
.clock { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px; }
.bar { display: grid; grid-template-columns: var(--phase-cols, 8fr 32fr 8fr); gap: 6px; }
.seg { border-radius: 10px; padding: 12px; border: 1.5px solid var(--line); min-height: 92px; display: flex; flex-direction: column; justify-content: space-between; }
.seg.prod { border-color: var(--amber); background: color-mix(in srgb, var(--amber) 13%, var(--panel)); }
.seg h3 { font-size: 14px; font-weight: 700; }
.seg .hrs { font-family: var(--display); font-size: 26px; }
.seg .lead { font-size: 12px; color: var(--muted); }
.ticks { display: grid; grid-template-columns: var(--phase-cols, 8fr 32fr 8fr); gap: 6px; margin-top: 6px; }
.ticks span { text-align: right; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.clock-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 20px; }
.clock-cols h3 { font-size: 15px; margin-bottom: 8px; }
.clock-cols ol, .clock-cols ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 14px; }
.clock-cols li::marker { color: var(--amber); font-family: var(--mono); }

/* people */
.leads { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.lead-card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.lead-card .phase { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--amber); }
.lead-card h3 { font-size: 17px; }
.lead-card p { margin: 0; font-size: 13px; color: var(--muted); }
.av { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-size: 16px; color: var(--bg); background: var(--amber); flex: none; }
.av.sm { width: 34px; height: 34px; font-size: 12px; background: var(--steel); }
.depts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
.dept { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.dept h3 { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; font-weight: 600; }
.person { display: flex; gap: 10px; align-items: center; padding: 6px 0; }
.person b { display: block; font-size: 14px; }
.person span { display: block; font-size: 12px; color: var(--muted); }
.person.wanted .av { background: transparent; border: 1.5px dashed var(--urgent); color: var(--urgent); }
.person.wanted b { color: var(--urgent); }

/* cast */
.cast { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.role { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
.role svg { display: block; width: 100%; height: auto; background: var(--panel-2); }
.role .body { padding: 12px 14px 14px; display: grid; gap: 6px; }
.role h3 { font-family: var(--display); font-size: 18px; }
.role p { margin: 0; font-size: 13px; color: var(--muted); }

/* locations */
.locs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.loc { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
.loc svg { display: block; width: 100%; height: auto; background: var(--panel-2); }
.loc .body { padding: 14px; display: grid; gap: 6px; }
.loc h3 { font-size: 16px; }
.loc p { margin: 0; font-size: 13px; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); margin-top: 12px; }

/* departments accordion */
.acc { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: start; }
details { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; }
details[open] { border-color: color-mix(in srgb, var(--amber) 45%, var(--line)); }
summary { list-style: none; cursor: pointer; padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
summary::-webkit-details-marker { display: none; }
summary h3 { font-size: 16px; }
summary .s { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
summary .plus { font-family: var(--mono); color: var(--amber); font-size: 18px; line-height: 1; transition: transform .2s; }
details[open] .plus { transform: rotate(45deg); }
details .inner { padding: 0 16px 16px; font-size: 14px; }
details .inner ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
details .inner li::marker { color: var(--amber); }
details .lead-in { font-size: 12px; font-family: var(--mono); color: var(--amber); margin: 0 0 8px; }

/* questions + rules */
.qs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.q { display: flex; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; align-items: flex-start; }
.q .mark { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1.5px dashed var(--steel); display: grid; place-items: center; font-family: var(--display); color: var(--steel); font-size: 13px; }
.q p { margin: 0; font-size: 14px; }
.q p span { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.rules { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; counter-reset: r; }
.rule { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; counter-increment: r; }
.rule::before { content: "0" counter(r); font-family: var(--display); color: var(--amber); font-size: 20px; display: block; margin-bottom: 6px; }
.rule b { display: block; font-size: 14px; margin-bottom: 4px; }
.rule span { font-size: 13px; color: var(--muted); }

footer { padding: 40px 0 56px; color: var(--muted); font-size: 13px; }
footer .wrap { border-top: 1px solid var(--line); padding-top: 18px; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; }

@media (max-width: 900px) {
  .track { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .leads { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .depts, .cast, .locs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rules { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .days { grid-template-columns: 1fr; }
}
@media (max-width: 620px) {
  .slate { grid-template-columns: 1fr; padding: 24px 18px 20px; }
  .slate-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .slate-grid div:nth-child(2) { border-right: 0; }
  .slate-grid div:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
  .countdown { display: flex; align-items: center; gap: 16px; text-align: left; }
  .countdown .num { font-size: 64px; }
  .paper { display: none; }
  .track { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .leads, .depts, .cast, .locs, .acc, .qs, .rules, .clock-cols, .later ul { grid-template-columns: 1fr; }
  .bar, .ticks { grid-template-columns: 1fr; }
  .ticks { display: none; }
  .seg { min-height: 0; }
  .seg .hrs { font-size: 20px; }
}
</style>
</head>
<body>

<nav class="top" aria-label="Sections">
  <div class="wrap" id="nav"></div>
</nav>

<header class="hero">
  <div class="wrap">
    <div class="slate">
      <div>
        <div class="label" id="updated"></div>
        <h1 id="title"></h1>
        <p class="sub" id="subtitle"></p>
        <div class="slate-grid">
          <div><span class="label">Title</span><b id="film-title"></b></div>
          <div><span class="label">Length</span><b id="film-length"></b></div>
          <div><span class="label">Clock</span><b id="clock-length"></b></div>
          <div><span class="label">Director</span><b id="director"></b></div>
        </div>
      </div>
      <div class="countdown" aria-live="polite">
        <svg class="paper" viewBox="0 0 170 120" role="img" aria-label="The YES and NO paper from the film, with two pencils balanced on it">
          <rect x="6" y="6" width="158" height="108" rx="4" fill="#ECE6DA"/>
          <g stroke="#B9B1A3" stroke-width="1"><line x1="45.5" y1="6" x2="45.5" y2="114"/><line x1="85" y1="6" x2="85" y2="114"/><line x1="124.5" y1="6" x2="124.5" y2="114"/><line x1="6" y1="60" x2="164" y2="60"/></g>
          <g font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" fill="#2B2620" text-anchor="middle">
            <text x="26" y="37">YES</text><text x="65" y="37">NO</text><text x="105" y="37">YES</text><text x="144" y="37">NO</text>
            <text x="26" y="91">NO</text><text x="65" y="91">YES</text><text x="105" y="91">NO</text><text x="144" y="91">YES</text>
          </g>
          <g transform="rotate(-18 85 60)"><rect x="35" y="56" width="100" height="7" rx="1.5" fill="#E3A247"/><polygon points="135,56 147,59.5 135,63" fill="#D8C7A8"/><rect x="31" y="56" width="5" height="7" fill="#D9694E"/></g>
          <g transform="rotate(14 85 60)"><rect x="35" y="56" width="100" height="7" rx="1.5" fill="#7E9BB8"/><polygon points="135,56 147,59.5 135,63" fill="#D8C7A8"/><rect x="31" y="56" width="5" height="7" fill="#D9694E"/></g>
        </svg>
        <div>
          <div class="num" id="days">&nbsp;</div>
          <div class="unit" id="days-unit"></div>
          <div class="when" id="clock-start-text"></div>
          <div class="tbc" id="clock-start-note" hidden></div>
        </div>
      </div>
    </div>
  </div>
</header>

<main>

<section id="status">
  <div class="wrap">
    <div class="sec-head"></div>
    <div class="track" id="track"></div>
  </div>
</section>

<section id="road">
  <div class="wrap">
    <div class="sec-head"></div>
    <div class="road">
      <div class="road-inner" id="road-inner">
        <div class="road-line"></div>
        <div class="road-fill" id="road-fill"></div>
        <div class="here" id="here"><i></i><span>WE'RE HERE</span></div>
      </div>
    </div>
    <p class="note" id="road-note"></p>
  </div>
</section>

<section id="due">
  <div class="wrap">
    <div class="sec-head"></div>
    <div class="days" id="days-grid"></div>
    <div class="later" id="later">
      <span class="label" id="later-heading"></span>
      <ul id="later-list"></ul>
    </div>
  </div>
</section>

<section id="clock">
  <div class="wrap">
    <div class="sec-head"></div>
    <div class="clock" id="clock-box">
      <div class="bar" id="clock-bar"></div>
      <div class="ticks" id="clock-ticks"></div>
      <div class="clock-cols">
        <div>
          <h3 id="clock-steps-heading"></h3>
          <ol id="clock-steps"></ol>
        </div>
        <div>
          <h3 id="clock-rules-heading"></h3>
          <ul id="clock-rules"></ul>
        </div>
      </div>
    </div>
  </div>
</section>

<section id="crew">
  <div class="wrap">
    <div class="sec-head"></div>
    <div class="leads" id="leads"></div>
    <div class="depts" id="depts"></div>
  </div>
</section>

<section id="cast">
  <div class="wrap">
    <div class="sec-head"></div>
    <div class="cast" id="cast-grid"></div>
  </div>
</section>

<section id="locations">
  <div class="wrap">
    <div class="sec-head"></div>
    <div class="locs" id="locs"></div>
    <p class="note" id="locations-note"></p>
  </div>
</section>

<section id="departments">
  <div class="wrap">
    <div class="sec-head"></div>
    <div class="acc" id="acc"></div>
  </div>
</section>

<section id="questions">
  <div class="wrap">
    <div class="sec-head"></div>
    <div class="qs" id="qs"></div>
  </div>
</section>

<section id="rules">
  <div class="wrap">
    <div class="sec-head"></div>
    <div class="rules" id="rules-grid"></div>
  </div>
</section>

</main>

<footer>
  <div class="wrap">
    <span id="footer-message"></span>
    <span id="footer-link"></span>
  </div>
</footer>

<script src="sheet-config.js"></script>
<script>
(function () {
  /* ---------- where the content comes from ----------
     Each sheet tab is read from the Google Sheet's published CSV (set up in sheet-config.js).
     If a tab isn't set up yet, or Google can't be reached, the copy in data/<file>.csv is used instead. */
  var TABS = {
    settings: 'Settings', sections: 'Sections', status: 'Status', timeline: 'Timeline',
    deadlines: 'Deadlines', clock: 'Clock', crew: 'Crew', 'open-roles': 'Open roles',
    cast: 'Cast', locations: 'Locations', departments: 'Departments', questions: 'Questions', rules: 'Rules'
  };
  var cfg = window.HUB_SHEET || {};
  var pubKey = ((cfg.publishedUrl || '').match(/\/d\/e\/([\w-]+)/) || [])[1];

  function sheetUrl(tabName) {
    var gid = cfg.tabs && cfg.tabs[tabName];
    if (!pubKey || gid === undefined || gid === null || String(gid).trim() === '') return null;
    return 'https://docs.google.com/spreadsheets/d/e/' + pubKey + '/pub?gid=' + String(gid).trim() + '&single=true&output=csv&t=' + Date.now();
  }
  function getText(url) {
    return fetch(url, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error(r.status + ' ' + url);
      return r.text();
    }).then(function (txt) {
      if (/^\s*<(!doctype|html)/i.test(txt)) throw new Error('Got a web page instead of CSV: ' + url);
      return txt;
    });
  }
  function loadTab(file) {
    var local = 'data/' + file + '.csv';
    var remote = sheetUrl(TABS[file]);
    var p = remote ? getText(remote).catch(function (e) { console.warn('Sheet tab "' + TABS[file] + '" failed, using ' + local, e); return getText(local); }) : getText(local);
    return p.then(parseCSV).catch(function (e) { console.error('Could not load ' + file, e); return []; });
  }

  /* ---------- CSV -> array of {header: value} ---------- */
  function parseCSV(text) {
    text = text.replace(/^﻿/, '');
    var rows = [], row = [], field = '', q = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
        else field += c;
      } else if (c === '"') q = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(field); rows.push(row); row = []; field = '';
      } else field += c;
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    if (!rows.length) return [];
    var head = rows[0].map(function (h) { return h.trim().toLowerCase().replace(/\s+/g, '_'); });
    return rows.slice(1).map(function (r) {
      var o = {};
      head.forEach(function (h, j) { o[h] = (r[j] || '').trim(); });
      return o;
    }).filter(function (o) { return Object.keys(o).some(function (k) { return o[k] !== ''; }); });
  }

  /* ---------- helpers ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  // Cell text: **bold** and *italic* are allowed.
  function fmt(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>'); }
  function $(id) { return document.getElementById(id); }
  function html(id, h) { var el = $(id); if (el) el.innerHTML = h; }
  function yes(v) { return /^(y|yes|true|x|1)$/i.test(String(v || '').trim()); }
  function safeUrl(u) { u = String(u || '').trim(); return /^https?:\/\//i.test(u) ? u : ''; }

  var COLOURS = {
    green: { hex: '#7DB089', pill: 'done', stage: 'is-done' },
    amber: { hex: '#E3A247', pill: 'wip', stage: 'is-wip' },
    blue:  { hex: '#7E9BB8', pill: 'todo', stage: '' },
    red:   { hex: '#D9694E', pill: 'urgent', stage: '' }
  };
  COLOURS.done = COLOURS.green; COLOURS.wip = COLOURS.amber; COLOURS.todo = COLOURS.blue; COLOURS.urgent = COLOURS.red;
  function colour(v) { return COLOURS[String(v || '').trim().toLowerCase()] || COLOURS.blue; }

  function initials(name) {
    var words = String(name).replace(/["“”'‘’][^"“”'‘’]*["“”'‘’]/g, ' ').trim().split(/\s+/).filter(Boolean);
    if (!words.length) return '?';
    if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
    return (words[0][0] + words[words.length - 1][0]).toUpperCase();
  }

  // Dates: 2026-12-04 is best, but 4/12/2026 (day first) and "4 Dec 2026" also work.
  function parseDate(s) {
    s = String(s || '').trim();
    var m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
    m = s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})/);
    if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
    var d = new Date(s);
    return isNaN(d) ? null : new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }

  var STATUS_ICONS = {
    story: '<rect x="7" y="4" width="20" height="26" rx="2"/><path d="M11 11h12M11 16h12M11 21h7"/>',
    crew: '<circle cx="12" cy="12" r="5"/><circle cx="23" cy="13" r="4"/><path d="M3 29c1-6 5-9 9-9s8 3 9 9M20 21c4 0 8 2 10 8"/>',
    locations: '<path d="M5 16L17 6l12 10v13H5z"/><rect x="14" y="20" width="6" height="9"/>',
    casting: '<circle cx="17" cy="11" r="6"/><path d="M6 30c1-8 6-11 11-11s10 3 11 11"/>',
    gear: '<rect x="4" y="10" width="20" height="15" rx="2"/><path d="M24 15l7-4v12l-7-4z"/>',
    clock: '<circle cx="17" cy="18" r="12"/><path d="M17 11v7l5 3M13 3h8"/>'
  };

  var FIGURES = {
    lead: '<circle cx="100" cy="52" r="22" fill="none" stroke="#E3A247" stroke-width="2.5"/><path d="M54 130c4-30 22-46 46-46s42 16 46 46" fill="none" stroke="#E3A247" stroke-width="2.5"/><circle cx="160" cy="26" r="9" fill="#E3A247" opacity=".35"/>',
    friend: '<circle cx="100" cy="52" r="20" fill="none" stroke="#9BA3AD" stroke-width="2.5"/><path d="M58 130c4-28 20-44 42-44s38 16 42 44" fill="none" stroke="#9BA3AD" stroke-width="2.5"/><rect x="138" y="92" width="26" height="20" rx="3" fill="none" stroke="#9BA3AD" stroke-width="2"/>',
    'older-child': '<circle cx="100" cy="66" r="17" fill="none" stroke="#7E9BB8" stroke-width="2.5"/><path d="M66 130c3-22 16-34 34-34s31 12 34 34" fill="none" stroke="#7E9BB8" stroke-width="2.5"/>',
    'younger-child': '<circle cx="100" cy="72" r="15" fill="none" stroke="#7E9BB8" stroke-width="2.5"/><path d="M70 130c3-19 14-30 30-30s27 11 30 30" fill="none" stroke="#7E9BB8" stroke-width="2.5"/>',
    unknown: '<rect x="70" y="24" width="60" height="84" rx="3" fill="none" stroke="#D9694E" stroke-width="2.5" stroke-dasharray="6 5"/><circle cx="100" cy="56" r="13" fill="none" stroke="#D9694E" stroke-width="2"/><path d="M80 108c2-16 10-24 20-24s18 8 20 24" fill="none" stroke="#D9694E" stroke-width="2"/>',
    adult: '<circle cx="100" cy="52" r="21" fill="none" stroke="#9BA3AD" stroke-width="2.5"/><path d="M56 130c4-29 21-45 44-45s40 16 44 45" fill="none" stroke="#9BA3AD" stroke-width="2.5"/>'
  };

  var SKETCHES = {
    flat: { label: "Rough sketch of Luka's flat: a bedroom, a long hallway, a kitchen and a bathroom", svg: '<g fill="none" stroke="#E3A247" stroke-width="2"><rect x="20" y="22" width="90" height="90"/><rect x="110" y="62" width="110" height="26"/><rect x="220" y="22" width="62" height="70"/><rect x="150" y="88" width="50" height="50"/></g><g font-family="IBM Plex Mono, monospace" font-size="11" fill="#ECE6DA" text-anchor="middle"><text x="65" y="70">Bedroom</text><text x="165" y="79">Hallway</text><text x="251" y="60">Kitchen</text><text x="175" y="117">Bath</text></g><path d="M65 112v24" stroke="#9BA3AD" stroke-width="1.5" stroke-dasharray="3 3"/><text x="65" y="152" font-family="IBM Plex Mono, monospace" font-size="10" fill="#9BA3AD" text-anchor="middle">enter</text><text x="282" y="160" font-family="IBM Plex Mono, monospace" font-size="9" fill="#9BA3AD" text-anchor="end">rough sketch, not to scale</text>' },
    homebase: { label: 'The Jungle, home base: a garage with tables, laptops and a coffee cup', svg: '<path d="M40 150V60l110-36 110 36v90" fill="none" stroke="#7E9BB8" stroke-width="2"/><rect x="70" y="100" width="160" height="10" rx="2" fill="none" stroke="#ECE6DA" stroke-width="2"/><path d="M84 110v40M216 110v40" stroke="#ECE6DA" stroke-width="2"/><rect x="92" y="80" width="34" height="20" rx="2" fill="none" stroke="#E3A247" stroke-width="2"/><rect x="140" y="80" width="34" height="20" rx="2" fill="none" stroke="#E3A247" stroke-width="2"/><path d="M190 88h14v12h-14zM204 91c6 0 6 6 0 6" fill="none" stroke="#ECE6DA" stroke-width="2"/><text x="150" y="58" font-family="IBM Plex Mono, monospace" font-size="11" fill="#ECE6DA" text-anchor="middle">HOME BASE</text>' },
    road: { label: 'A dusty gravel road with two small figures walking home', svg: '<path d="M120 170L146 40h8l26 130z" fill="#1C232D" stroke="#9BA3AD" stroke-width="1.5"/><g fill="#9BA3AD" opacity=".6"><circle cx="140" cy="140" r="1.5"/><circle cx="160" cy="120" r="1.5"/><circle cx="150" cy="96" r="1.2"/><circle cx="135" cy="160" r="1.5"/><circle cx="165" cy="150" r="1.5"/></g><g stroke="#E3A247" stroke-width="2" fill="none"><circle cx="143" cy="108" r="4"/><path d="M143 112v12M143 124l-4 8M143 124l4 8"/><circle cx="158" cy="112" r="3.5"/><path d="M158 115v10M158 125l-3 7M158 125l3 7"/></g><circle cx="240" cy="40" r="16" fill="#E3A247" opacity=".5"/>' },
    pin: { label: 'A map pin on a dashed route', svg: '<path d="M30 140c50-10 70-40 120-40s70 30 120 20" fill="none" stroke="#9BA3AD" stroke-width="1.5" stroke-dasharray="4 5"/><path d="M150 108c-16-20-26-34-26-48a26 26 0 0 1 52 0c0 14-10 28-26 48z" fill="none" stroke="#E3A247" stroke-width="2"/><circle cx="150" cy="60" r="9" fill="none" stroke="#E3A247" stroke-width="2"/>' }
  };

  /* ---------- render ---------- */
  function render(d) {
    var S = {};
    d.settings.forEach(function (r) { if (r.key) S[r.key] = r.value || ''; });

    // nav + section headings
    html('nav', d.sections.map(function (s) { return '<a href="#' + esc(s.id) + '">' + esc(s.nav_label || s.heading) + '</a>'; }).join(''));
    d.sections.forEach(function (s) {
      var sec = document.getElementById(s.id);
      var head = sec && sec.querySelector('.sec-head');
      if (head) head.innerHTML = '<span class="no">' + esc(s.number) + '</span><h2>' + fmt(s.heading) + '</h2>' + (s.intro ? '<p>' + fmt(s.intro) + '</p>' : '');
    });

    // hero
    html('updated', 'Production hub' + (S.updated ? ' · updated ' + esc(S.updated) : ''));
    html('title', esc(S.title_line_1) + '<br><span>' + esc(S.title_line_2) + '</span>');
    html('subtitle', fmt(S.subtitle));
    html('film-title', esc(S.film_title)); html('film-length', esc(S.film_length));
    html('clock-length', esc(S.clock_length)); html('director', esc(S.director));
    html('clock-start-text', fmt(S.clock_start_text));
    var note = $('clock-start-note'); note.textContent = S.clock_start_note || ''; note.hidden = !S.clock_start_note;

    var target = parseDate(S.clock_start_date);
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var num = $('days'), unit = $('days-unit');
    if (target) {
      var days = Math.round((target - today) / 864e5);
      if (days > 1) { num.textContent = days; unit.textContent = 'days to the clock'; }
      else if (days === 1) { num.textContent = '1'; unit.textContent = 'day to the clock'; }
      else if (days === 0) { num.textContent = '0'; unit.textContent = 'the clock starts today'; }
      else { num.textContent = 'GO'; unit.textContent = 'the clock has started'; }
    }

    // 01 status
    html('track', d.status.map(function (r) {
      var c = colour(r.colour);
      var icon = STATUS_ICONS[(r.icon || '').toLowerCase()] || STATUS_ICONS.story;
      return '<div class="stage ' + c.stage + '"><svg class="icon" viewBox="0 0 34 34" aria-hidden="true"><g fill="none" stroke="' + c.hex + '" stroke-width="2">' + icon + '</g></svg>' +
        '<h3>' + fmt(r.stage) + '</h3><p>' + fmt(r.description) + '</p><span class="pill ' + c.pill + '">' + esc(r.status) + '</span></div>';
    }).join(''));

    // 02 road
    var inner = $('road-inner');
    var here = $('here');
    d.timeline.forEach(function (r) {
      var el = document.createElement('div');
      var style = (r.style || '').toLowerCase();
      el.className = 'ms' + (/big/.test(style) ? ' big' : '') + (/tbc/.test(style) ? ' tbc' : '');
      el.setAttribute('data-date', r.date);
      el.innerHTML = '<div class="d">' + esc(r.date_label) + '</div><div class="t">' + fmt(r.milestone) + '</div><div class="dot"></div><div class="who">' + esc(r.who) + '</div>';
      inner.insertBefore(el, here);
    });
    html('road-note', fmt(S.road_note));
    placeRoad();

    // 03 due this week
    var dayOrder = [], byDay = {};
    d.deadlines.forEach(function (r) {
      if ((r.type || 'deadline').toLowerCase() === 'later') return;
      var k = r.day || 'Other';
      if (!byDay[k]) { byDay[k] = { when: '', tasks: [] }; dayOrder.push(k); }
      if (r.when && !byDay[k].when) byDay[k].when = r.when;
      byDay[k].tasks.push(r);
    });
    html('days-grid', dayOrder.map(function (k) {
      var day = byDay[k], everyone = false;
      var tasks = day.tasks.map(function (t) {
        var chips = (t.who || '').split(',').map(function (w) { return w.trim(); }).filter(Boolean).map(function (w) {
          var all = w.toLowerCase() === 'everyone'; if (all) everyone = true;
          return '<span class="chip' + (all ? ' all' : '') + '">' + esc(w) + '</span>';
        }).join('');
        return '<div class="task"><p>' + fmt(t.task) + '</p><div class="who-chips">' + chips + '</div></div>';
      }).join('');
      return '<div class="day' + (everyone ? ' mon' : '') + '"><div class="day-top"><h3>' + esc(k) + '</h3><span class="mono">' + esc(day.when) + '</span></div>' + tasks + '</div>';
    }).join(''));
    var later = d.deadlines.filter(function (r) { return (r.type || '').toLowerCase() === 'later'; });
    $('later').hidden = !later.length;
    html('later-heading', esc(S.later_heading));
    html('later-list', later.map(function (r) { return '<li><b>' + esc(r.who) + '</b><span>' + fmt(r.task) + '</span></li>'; }).join(''));

    // 04 the 48 hours
    var phases = d.clock.filter(function (r) { return (r.kind || '').toLowerCase() === 'phase'; });
    var total = 0;
    $('clock-box').style.setProperty('--phase-cols', phases.map(function (p) { return (parseFloat(p.hours) || 1) + 'fr'; }).join(' '));
    html('clock-bar', phases.map(function (p) {
      return '<div class="seg' + (yes(p.highlight) ? ' prod' : '') + '"><div><span class="label">' + esc(p.label) + '</span><h3>' + fmt(p.text) + '</h3></div><div><div class="hrs">' + esc(p.hours) + ' hrs</div><div class="lead">' + esc(p.lead) + '</div></div></div>';
    }).join(''));
    html('clock-ticks', phases.map(function (p) { total += parseFloat(p.hours) || 0; return '<span>hour ' + total + '</span>'; }).join(''));
    html('clock-steps-heading', esc(S.clock_steps_heading));
    html('clock-rules-heading', esc(S.clock_rules_heading));
    function kindList(k) { return d.clock.filter(function (r) { return (r.kind || '').toLowerCase() === k; }).map(function (r) { return '<li>' + fmt(r.text) + '</li>'; }).join(''); }
    html('clock-steps', kindList('step'));
    html('clock-rules', kindList('rule'));

    // 05 crew + open roles
    html('leads', d.crew.filter(function (p) { return p.lead_card; }).map(function (p) {
      return '<div class="lead-card"><div class="av">' + esc(p.initials || initials(p.name)) + '</div><div><div class="phase">' + esc(p.lead_card) + '</div><h3>' + esc(p.name) + '</h3></div><p>' + fmt(p.role) + '</p></div>';
    }).join(''));
    var deptOrder = [], depts = {};
    function dept(name) { if (!depts[name]) { depts[name] = []; deptOrder.push(name); } return depts[name]; }
    d.crew.forEach(function (p) {
      if (!p.department) return;
      dept(p.department).push('<div class="person"><div class="av sm">' + esc(p.initials || initials(p.name)) + '</div><div><b>' + esc(p.name) + '</b><span>' + fmt(p.role) + '</span></div></div>');
    });
    d['open-roles'].forEach(function (r) {
      dept(r.department || 'Other').push('<div class="person wanted"><div class="av sm">?</div><div><b>' + esc(r.role) + '</b><span>' + fmt(r.note) + '</span></div></div>');
    });
    // crew rows were added before open roles, so each box lists people first, then the gaps
    html('depts', deptOrder.map(function (name) {
      return '<div class="dept"><h3>' + esc(name) + '</h3>' + depts[name].join('') + '</div>';
    }).join(''));

    // 06 cast
    html('cast-grid', d.cast.map(function (r) {
      var c = colour(r.colour);
      var fig = FIGURES[(r.figure || '').toLowerCase()] || FIGURES.adult;
      return '<div class="role"><svg viewBox="0 0 200 130" aria-hidden="true">' + fig + '</svg><div class="body">' +
        (r.status ? '<span class="pill ' + c.pill + '">' + esc(r.status) + '</span>' : '') +
        '<h3>' + esc(r.role) + '</h3><p>' + fmt(r.description) + '</p>' +
        (r.in_the_running ? '<p><b>In the running:</b> ' + fmt(r.in_the_running) + '</p>' : '') + '</div></div>';
    }).join(''));

    // 07 locations
    html('locs', d.locations.map(function (r) {
      var sk = SKETCHES[(r.sketch || '').toLowerCase()] || SKETCHES.pin;
      var map = safeUrl(r.map_link);
      return '<div class="loc"><svg viewBox="0 0 300 170" role="img" aria-label="' + esc(sk.label) + '">' + sk.svg + '</svg><div class="body"><span class="label">' + esc(r.label) + '</span><h3>' + esc(r.name) + '</h3><p>' + fmt(r.description) + '</p>' +
        (map ? '<p><a href="' + esc(map) + '" target="_blank" rel="noopener">Open the pin</a></p>' : '') + '</div></div>';
    }).join(''));
    html('locations-note', fmt(S.locations_note));

    // 08 departments
    var accOrder = [], acc = {};
    d.departments.forEach(function (r) {
      var k = r.department; if (!k) return;
      if (!acc[k]) { acc[k] = { summary: '', points: [] }; accOrder.push(k); }
      if (r.summary && !acc[k].summary) acc[k].summary = r.summary;
      if (r.point) acc[k].points.push(r.point);
    });
    html('acc', accOrder.map(function (k) {
      return '<details><summary><h3>' + esc(k) + '</h3><span class="plus">+</span><span class="s">' + fmt(acc[k].summary) + '</span></summary><div class="inner"><ul>' +
        acc[k].points.map(function (p) { return '<li>' + fmt(p) + '</li>'; }).join('') + '</ul></div></details>';
    }).join(''));

    // 09 questions
    html('qs', d.questions.map(function (r) {
      return '<div class="q"><div class="mark">?</div><p>' + fmt(r.question) + (r.detail ? '<span>' + fmt(r.detail) + '</span>' : '') + '</p></div>';
    }).join(''));

    // 10 rules
    html('rules-grid', d.rules.map(function (r) { return '<div class="rule"><b>' + fmt(r.rule) + '</b><span>' + fmt(r.detail) + '</span></div>'; }).join(''));

    // footer
    html('footer-message', fmt(S.footer_message));
    var fl = safeUrl(S.footer_link_url);
    html('footer-link', fl ? esc(S.footer_link_intro) + ' <a href="' + esc(fl) + '">' + esc(S.footer_link_text || fl) + '</a>' : '');

    // jump to #section if the link had one (the section only had its content once loaded)
    if (location.hash) { var t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
  }

  function placeRoad() {
    var inner = $('road-inner');
    var ms = Array.prototype.slice.call(inner.querySelectorAll('.ms'));
    var n = ms.length;
    if (!n) return;
    function at(i) { return n === 1 ? 50 : 7 + i * (86 / (n - 1)); }
    var dates = ms.map(function (el, i) {
      el.style.left = at(i) + '%';
      var dt = parseDate(el.getAttribute('data-date'));
      return dt ? Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate()) : NaN;
    });
    var now = new Date();
    var t = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
    var hp = at(0);
    if (t >= dates[n - 1]) { hp = at(n - 1); }
    else { for (var i = 0; i < n - 1; i++) { if (t >= dates[i] && t < dates[i + 1]) { hp = at(i) + (t - dates[i]) / (dates[i + 1] - dates[i]) * (at(i + 1) - at(i)); } } }
    $('here').style.left = hp + '%';
    $('road-fill').style.width = hp + '%';
  }

  var files = Object.keys(TABS);
  Promise.all(files.map(loadTab)).then(function (results) {
    var d = {};
    files.forEach(function (f, i) { d[f] = results[i]; });
    render(d);
  });
})();
</script>
</body>
</html>
