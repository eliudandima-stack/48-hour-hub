<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=block" rel="stylesheet">
<style>
:root { --bg:#0D1015; --panel:#151A21; --line:#2A323E; --text:#ECE6DA; --muted:#9BA3AD; --amber:#E3A247; --steel:#7E9BB8; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; background: var(--bg); overflow: hidden; }
body { padding: 40px; font-family: "Archivo", Arial, sans-serif; color: var(--text); }
.slate { position: relative; height: 100%; background: var(--panel); border: 1.5px solid var(--line); border-radius: 28px; overflow: hidden; padding: 58px 48px 40px 52px; display: grid; grid-template-columns: 1fr 270px; gap: 28px; align-items: center; }
.slate::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 26px; background: repeating-linear-gradient(-45deg, var(--text) 0 26px, var(--bg) 26px 52px); opacity: .9; }
.label { font-family: "IBM Plex Mono", monospace; font-size: 17px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: "Archivo Black", Impact, sans-serif; font-weight: 400; font-size: 90px; line-height: .93; white-space: nowrap; letter-spacing: -.01em; margin-top: 18px; }
h1 span { color: var(--amber); }
.sub { margin-top: 22px; font-size: 25px; line-height: 1.35; color: var(--muted); max-width: 34ch; }
.grid { margin-top: 30px; display: grid; grid-template-columns: repeat(3, auto); border: 1.5px solid var(--line); border-radius: 14px; overflow: hidden; width: max-content; }
.grid div { padding: 12px 22px; border-right: 1.5px solid var(--line); }
.grid div:last-child { border-right: 0; }
.grid .label { font-size: 13px; }
.grid b { display: block; font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 22px; margin-top: 3px; }
.grid b.amber { color: var(--amber); }
.paper { width: 270px; transform: rotate(-4deg); filter: drop-shadow(0 18px 30px rgba(0,0,0,.45)); }
</style></head>
<body>
<div class="slate">
  <div>
    <div class="label">Production hub · a Namibian horror short</div>
    <h1>48 HOUR FILM<br><span>CHALLENGE</span></h1>
    <p class="sub">Script to final cut in 48 hours, by a crew of about 22 volunteers.</p>
    <div class="grid">
      <div><span class="label">Clock</span><b>48 hrs</b></div>
      <div><span class="label">Length</span><b>7 to 10 min</b></div>
      <div><span class="label">Clock starts</span><b class="amber">Fri 4 Dec</b></div>
    </div>
  </div>
  <svg class="paper" viewBox="0 0 170 120" xmlns="http://www.w3.org/2000/svg">
    <rect x="6" y="6" width="158" height="108" rx="4" fill="#ECE6DA"/>
    <g stroke="#B9B1A3" stroke-width="1"><line x1="45.5" y1="6" x2="45.5" y2="114"/><line x1="85" y1="6" x2="85" y2="114"/><line x1="124.5" y1="6" x2="124.5" y2="114"/><line x1="6" y1="60" x2="164" y2="60"/></g>
    <g font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" fill="#2B2620" text-anchor="middle">
      <text x="26" y="37">YES</text><text x="65" y="37">NO</text><text x="105" y="37">YES</text><text x="144" y="37">NO</text>
      <text x="26" y="91">NO</text><text x="65" y="91">YES</text><text x="105" y="91">NO</text><text x="144" y="91">YES</text>
    </g>
    <g transform="rotate(-18 85 60)"><rect x="35" y="56" width="100" height="7" rx="1.5" fill="#E3A247"/><polygon points="135,56 147,59.5 135,63" fill="#D8C7A8"/><rect x="31" y="56" width="5" height="7" fill="#D9694E"/></g>
    <g transform="rotate(14 85 60)"><rect x="35" y="56" width="100" height="7" rx="1.5" fill="#7E9BB8"/><polygon points="135,56 147,59.5 135,63" fill="#D8C7A8"/><rect x="31" y="56" width="5" height="7" fill="#D9694E"/></g>
  </svg>
</div>
</body></html>
